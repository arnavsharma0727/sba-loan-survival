[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sba-loan-survival"
version = "0.1.0"
description = "Competing-risk survival analysis of public SBA 7(a) records"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sba-survival = "sba_survival.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
